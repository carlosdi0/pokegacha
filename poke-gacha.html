<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Gacha · Pokémon TCG (prueba de concepto)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7ff;--ink:#2f3550;--red:#e8463c;--red2:#c9352c;--line:#dfe5f5;--blue:#3b6fe0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'M PLUS Rounded 1c',system-ui,sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(#dde4f7 1.6px,transparent 1.6px);background-size:22px 22px;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:14px 14px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:21px;margin:0;font-weight:800}
h1 span{color:var(--red)}
.pill{background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;box-shadow:0 3px 0 var(--line);font-size:15px;white-space:nowrap}
.tabs{display:flex;background:#fff;border-radius:999px;padding:4px;margin:12px 0 10px;box-shadow:0 3px 0 var(--line)}
.tab{flex:1;border:0;background:none;font:inherit;font-weight:800;color:var(--ink);padding:9px;border-radius:999px;cursor:pointer;font-size:15px}
.tab.on{background:var(--red);color:#fff}
.view{display:none}.view.on{display:block}
.setrow{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 3px 0 var(--line);margin-bottom:10px}
.setrow label{font-weight:800;font-size:13px;white-space:nowrap}
.setrow select{flex:1;min-width:0;font:inherit;font-size:14px;font-weight:700;border:2px solid var(--line);border-radius:10px;padding:6px;background:#fff;color:var(--ink)}
.stage3d{position:relative;width:100%;border-radius:26px;overflow:hidden;background:linear-gradient(#dfe9ff,#eef3ff 60%,#e3eafc);box-shadow:0 5px 0 var(--line);touch-action:none;user-select:none}
.stage3d canvas{display:block;width:100%;height:100%}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(255,255,255,.88);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.hint.big{top:auto;bottom:18px;font-size:15px;padding:8px 16px;background:var(--red);color:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.06)}}
.btn{display:block;width:100%;border:0;font:inherit;font-weight:800;font-size:19px;color:#fff;background:var(--red);border-radius:20px;padding:15px;box-shadow:0 5px 0 var(--red2);cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red2)}
.btn.soft{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);font-size:16px;padding:12px}
.btn.sm{font-size:15px;padding:10px;border-radius:16px}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:10px;margin-top:12px}
.row .btn{flex:1}
.note{text-align:center;font-size:13.5px;margin:10px 0 0;opacity:.85}
.status{text-align:center;font-size:12.5px;margin:8px 0 0;opacity:.7;min-height:1.2em}
/* reveal */
.reveal{position:fixed;inset:0;background:rgba(20,24,45,.72);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:10;perspective:1200px}
.reveal.on{display:flex}
.rays{position:absolute;width:150vmax;height:150vmax;left:50%;top:44%;transform:translate(-50%,-50%);opacity:0;transition:opacity .6s;pointer-events:none;animation:rot 14s linear infinite}
.reveal.flipped .rays{opacity:.55}
@keyframes rot{to{transform:translate(-50%,-50%) rotate(360deg)}}
.cardwrap{position:relative;width:min(64vw,270px);aspect-ratio:600/825;cursor:pointer;animation:deal .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes deal{from{transform:translateY(60vh) rotate(-12deg) scale(.6)}}
.card3d{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1);transform:rotateY(180deg) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.flipped .card3d{transform:rotateY(0deg) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
.flipped.tilting .card3d{transition:transform .08s}
.face{position:absolute;inset:0;border-radius:4.5%/3.3%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.back{transform:rotateY(180deg);background:radial-gradient(circle at 50% 50%,#3d5fd0 0 22%,#1d2f7a 23% 26%,#2b46a8 27% 60%,#1a2766 100%);border:9px solid #f1c94b;display:flex;align-items:center;justify-content:center}
.back::before{content:'★';font-size:64px;color:#ffe48a;text-shadow:0 0 18px #ffd34d}
.back::after{content:'CARD GACHA';position:absolute;bottom:12%;font-weight:800;letter-spacing:3px;color:#ffe48a;font-size:14px}
.front{background:#d9dde8}
.front img{width:100%;height:100%;display:block;object-fit:cover}
.front .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-weight:800;color:#667}
.holo{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:0;background:linear-gradient(115deg,transparent 20%,rgba(255,80,190,.55) 32%,rgba(80,230,255,.55) 45%,rgba(255,255,120,.55) 58%,rgba(120,255,160,.5) 68%,transparent 82%);background-size:260% 260%;background-position:var(--mx,50%) var(--my,50%)}
.glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.45),transparent 45%);mix-blend-mode:overlay;opacity:0}
.flipped .holo{opacity:var(--holo,0)}
.flipped .glare{opacity:.8}
.flipped:not(.tilting) .holo{animation:shimmer 3.5s ease-in-out infinite}
@keyframes shimmer{0%,100%{background-position:0% 30%}50%{background-position:100% 70%}}
.tapme{color:#fff;font-weight:800;margin-top:16px;animation:pulse2 1s ease-in-out infinite}
@keyframes pulse2{50%{opacity:.5}}
.flipped .tapme{display:none}
.rinfo{display:none;text-align:center;color:#fff;margin-top:14px;width:100%;max-width:340px}
.flipped .rinfo{display:block;animation:up .4s .35s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.chip{display:inline-block;border-radius:999px;padding:2px 12px;font-weight:800;font-size:12.5px;color:#2f3550}
.rname{font-size:22px;font-weight:800;margin:4px 0 0}
.rmeta{font-size:13px;opacity:.85;margin:2px 0 10px}
.spark{position:fixed;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:11;animation:spk 1s ease-out forwards}
@keyframes spk{to{transform:translate(var(--x),var(--y)) rotate(300deg);opacity:0}}
/* collection */
.prog{background:#fff;border-radius:999px;height:14px;overflow:hidden;box-shadow:0 3px 0 var(--line);margin:8px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ff8a80,#ffd54f);border-radius:999px;transition:width .5s}
.sec h2{font-size:15px;margin:16px 0 8px;display:flex;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.cc{position:relative;cursor:pointer;border-radius:7px;overflow:hidden;box-shadow:0 3px 8px rgba(40,50,90,.18);aspect-ratio:600/825;background:#e6e9f2}
.cc img{width:100%;height:100%;object-fit:cover;display:block}
.cc .cnt{position:absolute;top:5px;right:5px;background:rgba(30,35,60,.85);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
.cc .tier{position:absolute;left:5px;top:5px;width:12px;height:12px;border-radius:50%;border:2px solid #fff}
.empty{text-align:center;padding:30px 10px;opacity:.7;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(100px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%);opacity:1}
.foot{font-size:11px;opacity:.6;text-align:center;margin-top:22px;line-height:1.5}
.err{padding:40px 20px;text-align:center;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Card <span>Gacha</span></h1>
    <div class="pill">🪙 <b id="coins">0</b></div>
  </header>
  <div class="tabs"><button class="tab on" data-v="vm">Máquina</button><button class="tab" data-v="vc" id="tabCol">Mis cartas</button></div>

  <section class="view on" id="vm">
    <div class="setrow"><label for="setSel">Colección</label><select id="setSel"><option>Cargando…</option></select></div>
    <div class="stage3d" id="stage"><div class="hint" id="hint">Arrastra para girar · toca la manivela</div></div>
    <div style="margin-top:14px"><button class="btn" id="pullBtn">¡Girar! · 1 🪙</button></div>
    <p class="note" id="pityNote"></p>
    <div class="row"><button class="btn soft" id="refill">🪙 +10 monedas (demo)</button></div>
    <p class="status" id="status"></p>
  </section>

  <section class="view" id="vc">
    <div style="display:flex;justify-content:space-between;font-weight:800;margin-top:4px"><span>Mis cartas</span><span id="colCount"></span></div>
    <div class="prog"><i id="colBar"></i></div>
    <div id="colList"></div>
  </section>
  <p class="foot">Prueba de concepto no oficial. Datos e imágenes de cartas vía TCGdex.<br>Pokémon y sus cartas son marcas de Nintendo, Creatures, GAME FREAK y The Pokémon Company.</p>
</div>

<div class="reveal" id="reveal">
  <div class="rays" id="rays"></div>
  <div class="cardwrap" id="cardwrap">
    <div class="card3d" id="card3d">
      <div class="face back"></div>
      <div class="face front" id="front"><img id="cardImg" alt=""><div class="holo"></div><div class="glare"></div></div>
    </div>
  </div>
  <div class="tapme">Toca la carta para darle la vuelta</div>
  <div class="rinfo">
    <span class="chip" id="rChip"></span>
    <div class="rname" id="rName"></div>
    <div class="rmeta" id="rMeta"></div>
    <div class="row"><button class="btn soft sm" id="rClose">Cerrar</button><button class="btn sm" id="rAgain">Otra · 1 🪙</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const API='https://api.tcgdex.net/v2';
const LANG='es';
const FEATURED=['sv03.5','sv08.5','swsh7','base1'];
const TIERS={1:{n:'Común',c:'#e9edf5',holo:0},2:{n:'Rara',c:'#9cc3ff',holo:.35},3:{n:'Ultra rara',c:'#c9a6ff',holo:.6},4:{n:'Secreta',c:'#ffd54f',holo:.85}};

/* ---------- state ---------- */
const KEY='poke-card-gacha-v1';
let S={coins:20,owned:{},pity:0,set:''};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)S={...S,...s}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let AC;function blip(f=600,d=.12,t=0){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime+t,o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*1.5,n+d);g.gain.setValueAtTime(.12,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
const status=m=>$('status').textContent=m||'';

/* ---------- TCGdex ---------- */
async function getJSON(url){const r=await fetch(url);if(!r.ok)throw new Error(r.status);return r.json()}
const setCache={};
async function loadSetList(){
  let list;try{list=await getJSON(`${API}/${LANG}/sets`)}catch(e){list=await getJSON(`${API}/en/sets`)}
  if(!Array.isArray(list)||!list.length)throw new Error('lista vacía');const big=list.filter(s=>!s.cardCount||(s.cardCount.total||0)>=30);if(big.length)list=big;
  const feat=FEATURED.map(id=>list.find(s=>s.id===id)).filter(Boolean);
  const rest=list.filter(s=>!FEATURED.includes(s.id)).reverse();
  const sel=$('setSel');
  sel.innerHTML=(feat.length?`<optgroup label="Destacadas">${feat.map(o).join('')}</optgroup>`:'')+`<optgroup label="Todas">${rest.map(o).join('')}</optgroup>`;
  function o(s){return `<option value="${s.id}">${esc(s.name)}</option>`}
  const want=S.set&&list.some(s=>s.id===S.set)?S.set:(feat[0]||list[list.length-1]).id;
  sel.value=want;await selectSet(want);
}
async function loadSet(id){
  if(setCache[id])return setCache[id];
  let data,lang=LANG;
  try{data=await getJSON(`${API}/${LANG}/sets/${encodeURIComponent(id)}`);if(!data.cards||!data.cards.length)throw 0}
  catch(e){lang='en';data=await getJSON(`${API}/en/sets/${encodeURIComponent(id)}`)}
  const off=(data.cardCount&&data.cardCount.official)||data.cards.length;
  const isSecret=c=>{const n=parseInt(c.localId,10);return isNaN(n)||n>off};
  data.normal=data.cards.filter(c=>!isSecret(c));data.secret=data.cards.filter(isSecret);if(!data.normal.length)data.normal=data.cards;
  data.lang=lang;return setCache[id]=data;
}
let curSet=null;
async function selectSet(id){
  status('Cargando colección…');
  try{curSet=await loadSet(id);S.set=id;save();status(`${curSet.cards.length} cartas · ${curSet.secret.length} secretas`);drawPop()}
  catch(e){curSet=null;status('');toast('No se pudo conectar con TCGdex 😿')}
}
function tierOf(rarity,secret){
  const r=(rarity||'').toLowerCase();
  if(/special|especial|hyper|h[ií]per|secret|secreta|crown|corona|gold|oro|shiny ultra|mega hyper/.test(r))return 4;
  if(/illustration|ilustraci|ultra|double|doble|full|amazing|asombrosa|vmax|vstar|ace spec|radiant|radiante|shiny|variocolor|\bex\b|\bv\b|gx/.test(r))return 3;
  if(/holo|rare|rara/.test(r)&&!/uncommon|poco com/.test(r))return 2;
  if(!r&&secret)return 3;
  return 1;
}
async function drawCard(){
  const set=curSet,forced=S.pity>=9&&set.secret.length;
  const secret=set.secret.length&&(forced||Math.random()<.1);
  const pool=secret?set.secret:set.normal,brief=pool[(Math.random()*pool.length)|0];
  let d={...brief};
  try{d=await getJSON(`${API}/${set.lang}/cards/${encodeURIComponent(brief.id)}`)}catch(e){}
  let img=d.image||brief.image;
  if(!img&&set.lang!=='en'){try{const en=await getJSON(`${API}/en/cards/${encodeURIComponent(brief.id)}`);img=en.image;d.rarity=d.rarity||en.rarity}catch(e){}}
  const tier=tierOf(d.rarity,secret);
  S.pity=tier>=3?0:S.pity+1;
  return{id:brief.id,name:d.name||brief.name,img:img?img+'/high.webp':'',thumb:img?img+'/low.webp':'',rarity:d.rarity||'',tier,hp:d.hp,ill:d.illustrator,set:set.name,setId:set.id,num:`${brief.localId}/${(set.cardCount&&set.cardCount.official)||'?'}`};
}
function preload(src){return new Promise(r=>{if(!src)return r(false);const i=new Image();let done=false;const fin=v=>{if(!done){done=true;r(v)}};i.onload=()=>fin(true);i.onerror=()=>fin(false);setTimeout(()=>fin(false),8000);i.src=src})}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 3D ---------- */
const T=window.THREE;
let renderer,scene,camera,root,crank,popTex,ready=false;
const stageEl=$('stage');
const GRAD=T?(()=>{const t=new T.DataTexture(new Uint8Array([150,150,150,255,205,205,205,255,255,255,255,255]),3,1,T.RGBAFormat);t.minFilter=t.magFilter=T.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;return t})():null;
const MC={};const M=c=>MC[c]||(MC[c]=new T.MeshToonMaterial({color:c,gradientMap:GRAD}));
function mesh(geo,c,o={}){const m=new T.Mesh(geo,typeof c==='string'?M(c):c);if(o.p)m.position.set(...o.p);if(o.s!=null)(Array.isArray(o.s)?m.scale.set(...o.s):m.scale.setScalar(o.s));if(o.r)m.rotation.set(...o.r);m.castShadow=true;return m}
function rbox(w,h,d,r,c,p){const b=Math.min(r,w/2-.01,h/2-.01,d/2-.01)*.7,iw=w-2*b,ih=h-2*b,cr=Math.max(.001,Math.min(r*.6,iw/2-.001,ih/2-.001));const s=new T.Shape(),x=-iw/2,y=-ih/2;
  s.moveTo(x+cr,y);s.lineTo(x+iw-cr,y);s.quadraticCurveTo(x+iw,y,x+iw,y+cr);s.lineTo(x+iw,y+ih-cr);s.quadraticCurveTo(x+iw,y+ih,x+iw-cr,y+ih);s.lineTo(x+cr,y+ih);s.quadraticCurveTo(x,y+ih,x,y+ih-cr);s.lineTo(x,y+cr);s.quadraticCurveTo(x,y,x+cr,y);
  const g=new T.ExtrudeGeometry(s,{depth:Math.max(.001,d-2*b),bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:8});g.center();return mesh(g,c,{p})}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const t=new T.CanvasTexture(c);t.userData={c,draw};t.redraw=()=>{draw(c.getContext('2d'),w,h);t.needsUpdate=true};t.redraw();t.anisotropy=4;return t}
function rr(x,X,y,w,h,r){x.beginPath();x.moveTo(X+r,y);x.arcTo(X+w,y,X+w,y+h,r);x.arcTo(X+w,y+h,X,y+h,r);x.arcTo(X,y+h,X,y,r);x.arcTo(X,y,X+w,y,r);x.closePath()}
const FONT="'M PLUS Rounded 1c',system-ui,sans-serif";
const HTOP=T&&new T.SphereGeometry(1,28,14,0,Math.PI*2,0,Math.PI/2),HBOT=T&&new T.SphereGeometry(1,28,14,0,Math.PI*2,Math.PI/2,Math.PI/2),CYL=T&&new T.CylinderGeometry(1,1,1,32);
const CAPS=['#ff8a80','#82b1ff','#b9f6ca','#ffe57f','#ea80fc','#ffab91','#80deea'];
function capsule(c,r){const g=new T.Group();const t=mesh(HTOP,c,{s:r}),b=mesh(HBOT,'#f7f9ff',{s:r});const tm=t.material.clone();tm.transparent=true;tm.opacity=.92;t.material=tm;g.add(t,b);g.userData={top:t,bot:b};return g}

const BX=.8,BZ=.55,BY0=1.76,BY1=3.08,CR=.19,caps=[];
try{
  if(!T)throw 0;
  renderer=new T.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;stageEl.prepend(renderer.domElement);ready=true;
}catch(e){stageEl.innerHTML='<div class="err">Tu navegador no puede mostrar 3D 😿<br>(puedes seguir tirando con el botón)</div>'}

if(ready){
  scene=new T.Scene();camera=new T.PerspectiveCamera(36,1,.1,50);
  scene.add(new T.HemisphereLight('#ffffff','#e8eeff',.5));const dl=new T.DirectionalLight('#ffffff',.55);dl.position.set(3,7,5);dl.castShadow=true;dl.shadow.mapSize.set(1024,1024);Object.assign(dl.shadow.camera,{left:-4,right:4,top:5,bottom:-3,far:20});dl.shadow.bias=-.001;scene.add(dl);
  const gnd=new T.Mesh(new T.PlaneGeometry(30,30),new T.ShadowMaterial({opacity:.15}));gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;scene.add(gnd);
  const floor=new T.Mesh(new T.CircleGeometry(3,64),M('#d7e1fb'));floor.rotation.x=-Math.PI/2;floor.position.y=.002;floor.receiveShadow=true;scene.add(floor);
  root=new T.Group();scene.add(root);
  const RED='#e8463c',WHITE='#f7f9ff',SILVER='#cfd6e2',DARK='#2f3550';
  root.add(rbox(2.06,.18,1.52,.05,DARK,[0,.09,0]));
  const body=rbox(1.92,1.58,1.42,.1,RED,[0,.97,0]);body.receiveShadow=true;root.add(body);
  root.add(rbox(1.66,1.32,.06,.06,WHITE,[0,.98,.7]));
  // lineup POP
  popTex=canvasTex(512,420,drawPopCanvas);
  const pop=new T.Mesh(new T.PlaneGeometry(.86,.7),new T.MeshBasicMaterial({map:popTex}));pop.position.set(-.34,1.22,.735);root.add(pop);
  // coin mech
  root.add(rbox(.56,.86,.1,.05,SILVER,[.47,1.16,.75]));
  root.add(rbox(.2,.05,.04,.02,DARK,[.47,1.47,.8]));
  const priceTex=canvasTex(256,96,(x,w,h)=>{x.fillStyle='#fff';rr(x,0,0,w,h,20);x.fill();x.fillStyle=RED;x.font=`800 40px ${FONT}`;x.textAlign='center';x.textBaseline='middle';x.fillText('1 MONEDA',w/2,h/2+3)});
  const price=new T.Mesh(new T.PlaneGeometry(.42,.16),new T.MeshBasicMaterial({map:priceTex}));price.position.set(.47,1.34,.805);root.add(price);
  crank=new T.Group();crank.position.set(.47,.98,.81);crank.add(mesh(CYL,'#e9edf5',{s:[.21,.06,.21],r:[Math.PI/2,0,0]}),rbox(.09,.4,.08,.03,'#9aa4b8',[0,0,.05]),mesh(CYL,'#9aa4b8',{p:[0,0,.06],s:[.06,.06,.06],r:[Math.PI/2,0,0]}));root.add(crank);
  // exit
  root.add(rbox(.62,.4,.08,.08,DARK,[-.34,.52,.72]));
  const flap=new T.Mesh(new T.PlaneGeometry(.52,.28),new T.MeshBasicMaterial({color:'#aac4ff',transparent:true,opacity:.35}));flap.position.set(-.34,.55,.77);root.add(flap);
  // window
  for(const x of[-.93,.93])for(const z of[-.66,.66])root.add(rbox(.08,1.42,.08,.03,RED,[x,2.46,z]));
  root.add(rbox(1.92,.06,1.42,.02,RED,[0,1.79,0]));
  const glass=new T.Mesh(new T.BoxGeometry(1.86,1.38,1.32),new T.MeshPhongMaterial({color:'#e6f0ff',transparent:true,opacity:.12,shininess:200,specular:'#ffffff',depthWrite:false}));glass.position.set(0,2.46,0);glass.renderOrder=5;root.add(glass);
  const shine=new T.Mesh(new T.PlaneGeometry(.12,1.1),new T.MeshBasicMaterial({color:'#ffffff',transparent:true,opacity:.35,depthWrite:false}));shine.position.set(-.6,2.5,.665);shine.rotation.z=-.25;shine.renderOrder=6;root.add(shine);
  const shine2=shine.clone();shine2.scale.x=.4;shine2.position.x=-.45;root.add(shine2);
  // header
  root.add(rbox(2.0,.42,1.5,.08,RED,[0,3.38,0]));
  const signTex=canvasTex(640,140,(x,w,h)=>{x.fillStyle='#fff';rr(x,6,6,w-12,h-12,30);x.fill();x.fillStyle=RED;x.font=`800 64px ${FONT}`;x.textAlign='center';x.textBaseline='middle';x.fillText('CARD GACHA',w/2,h/2-8);x.font=`700 26px ${FONT}`;x.fillStyle=DARK;x.fillText('カードガチャ ★ 1 CARTA POR CÁPSULA',w/2,h/2+38)});
  const sign=new T.Mesh(new T.PlaneGeometry(1.8,.39),new T.MeshBasicMaterial({map:signTex}));sign.position.set(0,3.38,.755);root.add(sign);
  if(document.fonts)document.fonts.ready.then(()=>{signTex.redraw();priceTex.redraw();popTex.redraw()});
  for(let i=0;i<26;i++){const c=capsule(CAPS[i%CAPS.length],CR);c.position.set((Math.random()*2-1)*(BX-CR),BY0+CR+Math.random()*1.1,(Math.random()*2-1)*(BZ-CR));c.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);c.userData.v=new T.Vector3();root.add(c);caps.push(c)}
  for(let i=0;i<500;i++)physics(1/120);
}
function drawPopCanvas(x,w,h){
  x.clearRect(0,0,w,h);x.fillStyle='#fff';x.fillRect(0,0,w,h);
  x.fillStyle='#ffd54f';x.fillRect(0,0,w,92);
  x.fillStyle='#2f3550';x.font=`800 44px ${FONT}`;x.textAlign='center';x.textBaseline='middle';x.fillText('CARTAS POKÉMON',w/2,48);
  const name=curSet?curSet.name:'…';x.font=`800 ${name.length>18?30:38}px ${FONT}`;x.fillStyle='#e8463c';
  const words=name.split(' ');let lines=[''];for(const wd of words){const t=(lines[lines.length-1]+' '+wd).trim();if(x.measureText(t).width>w-40&&lines[lines.length-1])lines.push(wd);else lines[lines.length-1]=t}
  lines.slice(0,2).forEach((l,i)=>x.fillText(l,w/2,140+i*42));
  x.textAlign='left';x.font=`700 28px ${FONT}`;
  [4,3,2,1].forEach((k,i)=>{const y=232+i*44;x.fillStyle=TIERS[k].c;x.beginPath();x.arc(60,y,15,0,7);x.fill();x.strokeStyle='#2f3550';x.lineWidth=3;x.stroke();x.fillStyle='#2f3550';x.fillText(TIERS[k].n,90,y+2)});
}
function drawPop(){if(popTex)popTex.redraw()}

function physics(dt){
  for(const c of caps){c.userData.v.y-=7*dt;c.position.addScaledVector(c.userData.v,dt)}
  for(let i=0;i<caps.length;i++)for(let j=i+1;j<caps.length;j++){const a=caps[i],b=caps[j],d=b.position.clone().sub(a.position),L=d.length();if(L<2*CR&&L>1e-5){d.divideScalar(L);const ov=(2*CR-L)/2;a.position.addScaledVector(d,-ov);b.position.addScaledVector(d,ov);const rel=b.userData.v.clone().sub(a.userData.v).dot(d);if(rel<0){const imp=-1.25*rel/2;a.userData.v.addScaledVector(d,-imp);b.userData.v.addScaledVector(d,imp)}}}
  for(const c of caps){const p=c.position,v=c.userData.v;
    if(p.x<-BX+CR){p.x=-BX+CR;v.x=Math.abs(v.x)*.4}if(p.x>BX-CR){p.x=BX-CR;v.x=-Math.abs(v.x)*.4}
    if(p.z<-BZ+CR){p.z=-BZ+CR;v.z=Math.abs(v.z)*.4}if(p.z>BZ-CR){p.z=BZ-CR;v.z=-Math.abs(v.z)*.4}
    if(p.y<BY0+CR){p.y=BY0+CR;if(v.y<0)v.y*=-.3;v.x*=.93;v.z*=.93}if(p.y>BY1-CR){p.y=BY1-CR;if(v.y>0)v.y*=-.3}
    v.multiplyScalar(1-.6*dt);c.rotation.x+=v.z*dt/CR;c.rotation.z-=v.x*dt/CR}
}
function shake(){for(const c of caps){const v=c.userData.v;v.y+=1.5+Math.random()*2.5;v.x+=(Math.random()-.5)*2.4;v.z+=(Math.random()-.5)*2.4}}

const HOME={p:T?new T.Vector3(1.0,2.1,7.4):null,l:T?new T.Vector3(0,1.75,0):null},CLOSE={p:T?new T.Vector3(.3,1.5,5.4):null,l:T?new T.Vector3(0,.6,1.5):null};
const cam=T?{p:HOME.p.clone(),l:HOME.l.clone(),tp:HOME.p.clone(),tl:HOME.l.clone()}:null;
const setCam=pose=>{if(cam){cam.tp.copy(pose.p);cam.tl.copy(pose.l)}};
function resize(){if(!ready)return;const w=stageEl.clientWidth||360,h=Math.round(Math.min(560,w*1.2));stageEl.style.height=h+'px';renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=36*Math.min(1.25,Math.max(1,.85/(w/h)));camera.updateProjectionMatrix()}
addEventListener('resize',resize);

const tweens=[];const tw=(dur,fn)=>new Promise(r=>{if(!ready){fn(1);return r()}tweens.push({t:0,dur,fn,r})});
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;

/* ---------- flow ---------- */
let state='idle',drop=null,current=null,rotT=0,clock=0;
function setHint(t,big){const h=$('hint');if(!h)return;h.textContent=t;h.classList.toggle('big',!!big);h.style.opacity=t?1:0}
async function pull(){
  if(state!=='idle')return;
  if(!curSet){toast('Espera a que cargue la colección…');return}
  if(S.coins<1){toast('¡Sin monedas! Pulsa «+10 monedas»');return}
  closeReveal();showView('vm');setHint('');setCam(HOME);rotT=0;
  S.coins--;save();render();state='spinning';
  const cardP=drawCard().then(async c=>{c.loaded=await preload(c.img);return c}).catch(()=>null);
  blip(330,.15);blip(440,.15,.3);blip(550,.15,.6);
  let last=0;await tw(1.1,k=>{if(crank)crank.rotation.z=-ease(k)*Math.PI*2;if(k-last>.12){shake();last=k}});
  status('Sacando la cápsula…');
  current=await cardP;status(curSet?`${curSet.cards.length} cartas · ${curSet.secret.length} secretas`:'');
  if(!current){S.coins++;save();render();state='idle';toast('Error al conectar con TCGdex. Te devuelvo la moneda 🪙');return}
  addToCollection(current);
  if(!ready){state='waiting';openCap();return}
  const col=current.tier===4?'#ffd54f':current.tier===3?'#ea80fc':CAPS[(Math.random()*CAPS.length)|0];
  drop=capsule(col,.24);scene.add(drop);state='dropping';
  const start=new T.Vector3(-.34,.5,.8).applyAxisAngle(new T.Vector3(0,1,0),root.rotation.y);
  setCam(CLOSE);blip(260,.1,.1);
  await tw(1.0,k=>{const e=1-Math.pow(1-k,2);drop.position.set(start.x+(0-start.x)*e,.24+Math.abs(Math.sin(k*Math.PI*2.5))*.45*(1-k)+(1-k)*.2,start.z+(1.6-start.z)*e);drop.rotation.set(k*Math.PI*4,0,0)});
  drop.rotation.set(0,0,0);state='waiting';setHint('¡Toca la cápsula! ✨',true);
}
async function openCap(){
  if(state!=='waiting')return;state='opening';setHint('');
  if(drop){const{top,bot}=drop.userData;blip(700,.12);
    await tw(.55,k=>{top.position.set(0,k*1.4,-k*.5);top.rotation.x=-k*2;bot.position.y=-k*.2;const s=.24*Math.max(.001,1-k*1.2);top.scale.setScalar(s);bot.scale.setScalar(s)});
    scene.remove(drop);drop=null}
  showReveal(current,false);
}
function showReveal(c,faceUp){
  const rv=$('reveal');rv.classList.remove('flipped','tilting');
  $('cardImg').src=c.img||'';$('cardImg').style.display=c.img&&c.loaded!==false?'block':'none';
  const front=$('front');front.querySelector('.ph')?.remove();if(!c.img||c.loaded===false)front.insertAdjacentHTML('beforeend',`<div class="ph">${esc(c.name)}<br><small>(imagen no disponible)</small></div>`);
  $('cardImg').onerror=()=>{if($('cardImg').src.includes('/'+LANG+'/')){$('cardImg').src=$('cardImg').src.replace('/'+LANG+'/','/en/')}};
  rv.style.setProperty('--holo',TIERS[c.tier].holo);
  $('rays').style.background=`repeating-conic-gradient(${TIERS[c.tier].c}55 0 10deg,transparent 10deg 24deg)`;
  $('rChip').textContent=c.rarity||TIERS[c.tier].n;$('rChip').style.background=TIERS[c.tier].c;
  $('rName').textContent=c.name;
  const n=(S.owned[c.id]||{}).n||1;
  $('rMeta').innerHTML=[esc(c.set)+' · '+esc(c.num),c.hp?`PS ${esc(c.hp)}`:'',c.ill?`Ilus. ${esc(c.ill)}`:'',faceUp?`Tienes ×${n}`:(n>1?`Repetida ×${n}`:'🎉 ¡Nueva!')].filter(Boolean).join(' · ');
  $('rAgain').textContent=faceUp?'Girar · 1 🪙':'Otra · 1 🪙';
  rv.dataset.mode=faceUp?'view':'pull';
  rv.classList.add('on');
  // reset deal animation
  const cw=$('cardwrap');cw.style.animation='none';void cw.offsetWidth;cw.style.animation='';
  if(faceUp)setTimeout(()=>rv.classList.add('flipped'),30);
}
function flip(){const rv=$('reveal');if(rv.classList.contains('flipped'))return;rv.classList.add('flipped');const t=current.tier;
  ({1:[660],2:[660,880],3:[660,880,990],4:[523,660,784,1046,1318]})[t].forEach((f,i)=>blip(f,.18,i*.1));
  if(t>=2){const r=$('cardwrap').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;const cols=t===4?['#ffd54f','#fff59d','#ffffff','#ffb300']:['#82b1ff','#ea80fc','#b9f6ca','#ffffff'];
    for(let i=0;i<(t===4?70:t===3?40:20);i++){const s=document.createElement('span');s.className='spark';const a=Math.random()*Math.PI*2,d=120+Math.random()*180;s.style.left=cx+'px';s.style.top=cy+'px';s.style.background=cols[i%cols.length];s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1050)}}
}
function closeReveal(){$('reveal').classList.remove('on','flipped','tilting');if(state==='opening'){state='idle';setCam(HOME);setHint('Arrastra para girar · toca la manivela')}}

function addToCollection(c){const o=S.owned[c.id];S.owned[c.id]={n:(o?o.n:0)+1,name:c.name,img:c.img,thumb:c.thumb,rarity:c.rarity,tier:c.tier,set:c.set,setId:c.setId,num:c.num,hp:c.hp,ill:c.ill,t:Date.now()};save();render()}

/* tilt */
const cw=$('cardwrap');
cw.addEventListener('pointermove',e=>{const rv=$('reveal');if(!rv.classList.contains('flipped'))return;const r=cw.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;rv.classList.add('tilting');const c=$('card3d');c.style.setProperty('--ry',((px-.5)*24)+'deg');c.style.setProperty('--rx',(-(py-.5)*24)+'deg');rv.style.setProperty('--mx',px*100+'%');rv.style.setProperty('--my',py*100+'%');rv.style.setProperty('--gx',px*100+'%');rv.style.setProperty('--gy',py*100+'%')});
cw.addEventListener('pointerleave',()=>{const c=$('card3d');c.style.setProperty('--ry','0deg');c.style.setProperty('--rx','0deg');$('reveal').classList.remove('tilting')});
cw.addEventListener('click',flip);

/* input on canvas */
let down=null;const ray=T?new T.Raycaster():null;
if(ready){const cv=renderer.domElement;
  cv.addEventListener('pointerdown',e=>{down={lx:e.clientX,moved:0};cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.lx;down.lx=e.clientX;down.moved+=Math.abs(dx);if(state==='idle'||state==='waiting'){rotT=Math.max(-1.1,Math.min(1.1,rotT+dx*.012))}});
  cv.addEventListener('pointerup',e=>{if(!down)return;const m=down.moved;down=null;if(m>8)return;if(state==='waiting'){openCap();return}
    const r=cv.getBoundingClientRect();ray.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-(e.clientY-r.top)/r.height*2+1},camera);if(ray.intersectObject(crank,true).length)pull()});
}
let lastT=performance.now();
function loop(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;clock+=dt;
  for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=dt;const k=Math.min(1,w.t/w.dur);w.fn(k);if(k>=1){tweens.splice(i,1);w.r()}}
  for(let s=0;s<3;s++)physics(dt/3);
  root.rotation.y+=(rotT-root.rotation.y)*.12;if(!down&&state==='idle')rotT*=.985;
  if(drop&&state==='waiting'){drop.rotation.z=Math.sin(clock*7)*.18;drop.position.y=.24+Math.abs(Math.sin(clock*3.5))*.06}
  cam.p.lerp(cam.tp,.06);cam.l.lerp(cam.tl,.06);camera.position.copy(cam.p);camera.lookAt(cam.l);
  renderer.render(scene,camera);requestAnimationFrame(loop)}

/* ---------- UI ---------- */
function render(){
  $('coins').textContent=S.coins;
  const ids=Object.keys(S.owned);$('tabCol').textContent=`Mis cartas (${ids.length})`;
  const left=10-S.pity;$('pityNote').innerHTML=left<=1?'✨ ¡La próxima es una <b>carta secreta</b> seguro!':`Carta secreta garantizada en <b>${left}</b> tiradas`;
  const bySet={};ids.forEach(id=>{const c=S.owned[id];(bySet[c.set]=bySet[c.set]||[]).push([id,c])});
  const tot=curSet&&bySet[curSet.name]?bySet[curSet.name].length:0;
  $('colCount').textContent=curSet?`${tot}/${curSet.cards.length} de ${curSet.name}`:`${ids.length}`;
  $('colBar').style.width=curSet?(tot/curSet.cards.length*100)+'%':'0%';
  $('colList').innerHTML=ids.length?Object.entries(bySet).map(([s,arr])=>{arr.sort((a,b)=>b[1].tier-a[1].tier||parseInt(a[1].num)-parseInt(b[1].num));
    return `<div class="sec"><h2><span>${esc(s)}</span><span>${arr.length}</span></h2><div class="grid">${arr.map(([id,c])=>`<div class="cc" data-id="${esc(id)}">${c.thumb?`<img loading="lazy" alt="${esc(c.name)}" src="${esc(c.thumb)}" onerror="if(!this.dataset.f){this.dataset.f=1;this.src=this.src.replace('/${LANG}/','/en/')}">`:''}<span class="tier" style="background:${TIERS[c.tier].c}"></span>${c.n>1?`<span class="cnt">×${c.n}</span>`:''}</div>`).join('')}</div></div>`}).join(''):'<div class="empty">Aún no tienes cartas.<br>¡Gira la máquina! 🎰</div>';
}
function showView(v){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id===v));if(v==='vm')resize()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>showView(t.dataset.v));
$('pullBtn').onclick=pull;
$('rAgain').onclick=()=>{closeReveal();pull()};
$('rClose').onclick=closeReveal;
$('refill').onclick=()=>{S.coins+=10;save();render();blip(880,.15);blip(1175,.2,.12)};
$('setSel').onchange=e=>{if(state!=='idle'){toast('Espera a que termine la tirada');e.target.value=S.set;return}selectSet(e.target.value).then(render)};
$('colList').onclick=e=>{const el=e.target.closest('.cc');if(!el)return;const c=S.owned[el.dataset.id];current={...c,id:el.dataset.id,loaded:true};showReveal(current,true)};
$('reveal').onclick=e=>{if(e.target.id==='reveal'&&$('reveal').classList.contains('flipped'))closeReveal()};

if(ready){resize();requestAnimationFrame(loop)}
render();
function boot(){status('Conectando con TCGdex…');loadSetList().then(render).catch(e=>{
  const net=e instanceof TypeError||/fetch|network|load failed/i.test(e.message||'');
  status(net?'No hay acceso a internet desde aquí. Abre el archivo en Chrome/Safari (no en la vista previa de una app).':'Error: '+(e.message||e));
  $('setSel').innerHTML='<option>Sin conexión — toca «Reintentar»</option>';
  if(!$('retry')){$('status').insertAdjacentHTML('afterend','<div class="row"><button class="btn soft" id="retry">🔄 Reintentar</button></div>');$('retry').onclick=()=>{$('retry').parentNode.remove();boot()}}
})}
boot();
</script>
</body>
</html>
